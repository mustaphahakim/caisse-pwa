name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths: ['index.html', 'android/**', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Copier la page dans l'app
        run: cp index.html android/app/src/main/assets/index.html
      - name: Compiler
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Caisse.apk
      - uses: actions/upload-artifact@v4
        with: { name: Caisse-apk, path: Caisse.apk }
      - name: Publier une Release (téléchargement direct depuis le téléphone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Caisse APK (dernière version)
          files: Caisse.apk
