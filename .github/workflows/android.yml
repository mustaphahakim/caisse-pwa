name: Build Android APK
on:
  workflow_dispatch:
  push:
    paths: ['index.html', 'android/**', '.github/workflows/android.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Copier la page dans l'app
        run: cp index.html android/app/src/main/assets/index.html
      - name: Compiler
        working-directory: android
        run: |
          set +e
          gradle --no-daemon assembleRelease > build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "::error::$(grep -E 'error:|What went wrong|Execution failed|Could not|not found|Caused by|FAILED|rror' -A2 build.log | head -14 | tr '\n' ' ' | cut -c1-900)"
          fi
          exit $rc
      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Caisse.apk
      - uses: actions/upload-artifact@v4
        with: { name: Caisse-apk, path: Caisse.apk }
      - name: Publier une Release (téléchargement direct depuis le téléphone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: Caisse APK (dernière version)
          files: Caisse.apk
